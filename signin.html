<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockClear - 로그인 및 회원가입</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-[#0b1120] text-gray-100 min-h-screen flex items-center justify-center p-4 antialiased relative overflow-x-hidden">

  <!-- BACKGROUND DECORATIONS -->
  <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-80 h-80 bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- AUTH CONTAINER -->
  <div class="w-full max-w-md relative z-10">
    
    <!-- BRAND LOGO -->
    <div class="text-center mb-8">
      <a href="upload.html" class="inline-flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-blue-500/40">
          S
        </div>
        <span class="font-extrabold text-2xl tracking-tight text-white">Stock<span class="text-blue-500">Clear</span></span>
      </a>
      <p class="text-gray-400 text-xs mt-2">스마트한 재고 최적화 데이터 솔루션</p>
    </div>

    <!-- MAIN CARD -->
    <div class="bg-gray-900/80 backdrop-blur-xl border border-gray-800 rounded-3xl p-8 shadow-2xl">
      
      <!-- TAB TOGGLE BUTTONS -->
      <div class="grid grid-cols-2 p-1 bg-gray-950/80 rounded-xl border border-gray-800/80 mb-6">
        <button id="tab-login" onclick="switchTab('login')" class="py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition-all duration-200">
          로그인
        </button>
        <button id="tab-signup" onclick="switchTab('signup')" class="py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all duration-200">
          회원가입
        </button>
      </div>

      <!-- 1. LOGIN FORM -->
      <form id="form-login" action="/api/login" method="post" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">이메일 계정</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="email" name="email" required placeholder="example@domain.com"
                   class="w-full bg-gray-950 border border-gray-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-600 outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">비밀번호</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="password" name="password" required placeholder="••••••••"
                   class="w-full bg-gray-950 border border-gray-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-600 outline-none transition-all">
          </div>
        </div>

        <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded bg-gray-950 border-gray-800 text-blue-600 focus:ring-0 focus:ring-offset-0">
            <span class="ml-2">로그인 상태 유지</span>
          </label>
          <a href="#" class="hover:text-blue-400 transition-colors">비밀번호 찾기</a>
        </div>

        <button type="button" onclick="handleLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition-all text-sm mt-2">
          로그인
        </button>
      </form>

      <!-- 2. SIGNUP FORM (기본 숨김) -->
      <form id="form-signup" action="/api/signup" method="post" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">이름 / 매장명</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="text" name="name" required placeholder="홍길동 (또는 OO점)"
                   class="w-full bg-gray-950 border border-gray-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-600 outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">이메일 계정</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="email" name="email" required placeholder="example@domain.com"
                   class="w-full bg-gray-950 border border-gray-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-600 outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">비밀번호</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="password" name="password" required placeholder="8자 이상 입력"
                   class="w-full bg-gray-950 border border-gray-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-600 outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">비밀번호 확인</label>
          <div class="relative">
            <i class="fa-solid fa-shield-halved absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="password" name="password_confirm" required placeholder="비밀번호 다시 입력"
                   class="w-full bg-gray-950 border border-gray-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-600 outline-none transition-all">
          </div>
        </div>

        <button type="button" onclick="handleSignup()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition-all text-sm mt-2">
          회원가입 시작하기
        </button>
      </form>

    </div>
  </div>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('form-login');
      const signupForm = document.getElementById('form-signup');
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        
        tabLogin.className = 'py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition-all duration-200';
        tabSignup.className = 'py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all duration-200';
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');

        tabSignup.className = 'py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition-all duration-200';
        tabLogin.className = 'py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all duration-200';
      }
    }

    function handleLogin() {
      alert("로그인 성공! 업로드 페이지로 이동합니다.");
      window.location.href = "upload.html";
    }

    function handleSignup() {
      alert("회원가입이 완료되었습니다! 로그인해 주세요.");
      switchTab('login');
    }
  </script>
</body>
</html>
