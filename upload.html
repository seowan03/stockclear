<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockClear - 데이터 업로드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .laser-line {
      background: linear-gradient(90deg, rgba(59,130,246,0) 0%, rgba(59,130,246,1) 50%, rgba(147,197,253,1) 100%);
      height: 2px;
      box-shadow: 0 0 10px #3b82f6;
    }
    .drag-active {
      border-color: #2563eb !important;
      background-color: #eff6ff !important;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

  <!-- NAVIGATION HEADER -->
  <header class="bg-[#0b1120] border-b border-gray-800 text-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="upload.html" class="flex items-center space-x-3 cursor-pointer">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-xl shadow-lg shadow-blue-500/50">
          S
        </div>
        <span class="font-extrabold text-xl tracking-tight text-white">Stock<span class="text-blue-500">Clear</span></span>
      </a>

      <!-- Navigation Tabs (3개 통합 메뉴) -->
      <nav class="hidden md:flex items-center space-x-1 bg-gray-900/80 p-1 rounded-xl border border-gray-800">
        <a href="upload.html" class="px-4 py-1.5 text-sm font-semibold rounded-lg bg-blue-600 text-white shadow-md">
          <i class="fa-solid fa-cloud-arrow-up mr-2"></i>데이터 업로드
        </a>
        <a href="dashboard.html" class="px-4 py-1.5 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-colors">
          <i class="fa-solid fa-chart-pie mr-2"></i>분석 대시보드
        </a>
        <a href="inventory.html" class="px-4 py-1.5 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-colors">
          <i class="fa-solid fa-boxes-stacked mr-2"></i>전체 재고 목록
        </a>
      </nav>

      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2 bg-gray-900 px-3 py-1.5 rounded-full border border-gray-800">
          <div class="w-7 h-7 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-xs">
            <i class="fa-solid fa-user"></i>
          </div>
          <span class="text-xs font-medium text-gray-300">Store Manager</span>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1">
    <!-- HERO AREA (DARK THEME) -->
    <div class="bg-[#0b1120] text-white pt-12 pb-24 px-6 relative overflow-hidden border-b border-gray-800">
      <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>
      <div class="absolute top-1/2 left-10 w-72 h-72 bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>

      <div class="max-w-4xl mx-auto text-center relative z-10 space-y-4">
        <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/30 text-blue-400 text-xs font-semibold">
          <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
          <span>AI 기반 재고 데이터 분석엔진 v2.4</span>
        </div>
        
        <h1 class="text-3xl md:text-5xl font-black tracking-tight leading-tight">
          디지털 솔루션으로<br>
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-blue-200">실질적인 재고 최적화</span>를 이끄세요
        </h1>
        
        <p class="text-gray-400 text-sm md:text-base max-w-xl mx-auto font-normal">
          매장의 엑셀 파일 하나만 업로드하면 AI가 실시간으로 재고 위험도, 과다 재고, 자동 발주 필요 항목을 완벽 분석해 드립니다.
        </p>

        <div class="pt-2">
          <div class="laser-line max-w-md mx-auto rounded-full"></div>
        </div>
      </div>
    </div>

    <!-- UPLOAD CARD CONTAINER -->
    <div class="max-w-3xl mx-auto px-6 -mt-16 pb-16 relative z-20">
      <div class="bg-white rounded-3xl p-8 md:p-10 shadow-2xl border border-gray-100/80 backdrop-blur-lg">
        <div class="text-center mb-8">
          <h2 class="text-2xl font-bold text-gray-900 tracking-tight">재고 데이터 분석 시작하기</h2>
          <p class="text-gray-500 text-sm mt-1">매장의 재고 엑셀 파일(.xlsx, .csv)을 업로드하여 분석 리포트를 확인해보세요.</p>
        </div>

        <!-- DRAG & DROP ZONE -->
        <div id="drop-zone" onclick="document.getElementById('file-input').click()" 
             class="border-2 border-dashed border-gray-300 hover:border-blue-500 bg-gray-50/80 hover:bg-blue-50/40 rounded-2xl p-10 text-center cursor-pointer transition-all duration-300 group">
          
          <input type="file" id="file-input" accept=".xlsx, .csv" class="hidden" onchange="handleFileSelect(event)">
          
          <div class="flex justify-center mb-4">
            <div class="relative">
              <div class="w-16 h-20 bg-emerald-600 rounded-lg shadow-md flex flex-col items-center justify-center text-white font-bold text-xl group-hover:scale-105 transition-transform duration-300">
                <span>X</span>
                <div class="w-8 h-0.5 bg-emerald-400 mt-1"></div>
                <div class="w-8 h-0.5 bg-emerald-400 mt-1"></div>
              </div>
              <div class="absolute -bottom-2 -right-2 w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg border-2 border-white group-hover:bg-blue-700 transition-colors">
                <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
              </div>
            </div>
          </div>

          <p class="text-gray-700 font-semibold text-base mb-3">
            여기로 엑셀 파일을 드래그하여 업로드하거나
          </p>

          <button type="button" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl text-sm shadow-lg shadow-blue-500/30 transition-all duration-200">
            파일 선택
          </button>

          <p class="text-xs text-gray-400 mt-4">
            지원 형식: .xlsx, .csv (최대 10MB)
          </p>
        </div>

        <!-- SAMPLE DATA BUTTON -->
        <div class="mt-6 text-center">
          <button onclick="loadSampleAndAnalyze()" class="inline-flex items-center text-xs font-semibold text-blue-600 hover:text-blue-800 hover:underline transition-colors py-2 px-3 rounded-lg hover:bg-blue-50">
            <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> 샘플 엑셀 데이터로 테스트해보기
          </button>
        </div>

      </div>
    </div>
  </main>

  <script>
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        alert(`'${file.name}' 파일을 분석합니다. 대시보드로 이동합니다.`);
        window.location.href = "dashboard.html";
      }
    }

    function loadSampleAndAnalyze() {
      alert("샘플 엑셀 데이터 분석 결과를 불러옵니다.");
      window.location.href = "dashboard.html";
    }

    const dropZone = document.getElementById('drop-zone');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-active'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-active'), false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        alert(`'${files[0].name}' 파일을 분석합니다. 대시보드로 이동합니다.`);
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
