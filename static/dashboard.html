<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockClear - 대시보드</title>
  <!-- FontAwesome & Chart.js CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dashboard-page">

  <!-- 상단 네비게이션 바 -->
  <nav class="navbar">
    <a href="mainpage.html" class="logo">
      <div class="logo-icon">S</div>
      <span>StockClear</span>
    </a>
    <div class="nav-links">
      <a href="mainpage.html" class="nav-link"><i class="fa-solid fa-house"></i> 메인 Home</a>
      <a href="upload.html" class="nav-link"><i class="fa-solid fa-cloud-arrow-up"></i> 업로드</a>
      <a href="history.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left"></i> 업로드 기록</a>
      <a href="dashboard.html" class="nav-link active"><i class="fa-solid fa-chart-pie"></i> 대시보드</a>
      <a href="inventory.html" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> 재고 목록</a>
      <a href="strategy.html" class="nav-link"><i class="fa-solid fa-wand-magic-sparkles"></i> AI 전략</a>
      <a href="export.html" class="nav-link"><i class="fa-solid fa-file-export"></i> 내보내기</a>
    </div>
    <div class="auth-buttons">
      <a href="signin.html" class="btn-login">로그인</a>
      <a href="signin.html" class="btn-signup">회원가입</a>
    </div>
  </nav>

  <!-- 메인 타이틀 영역 -->
  <div class="content-header">
    <div class="page-title">
      <h1>재고 실시간 현황 대시보드</h1>
      <p>업로드된 파일 기반 AI 실시간 종합 모니터링</p>
    </div>
    <a href="strategy.html" class="btn-ai-strategy">🪄 AI 전략 바로가기</a>
  </div>

  <!-- KPI 카드 4개 -->
  <section class="kpi-container">
    <div class="kpi-card">
      <div class="kpi-title">총 SKU 항목</div>
      <div class="kpi-value">1,248 개</div>
      <div class="kpi-sub up">↑ 정상 등록 완료</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">결품 주의 품목</div>
      <div class="kpi-value text-red">23 개</div>
      <div class="kpi-sub danger">⚠️ 안전재고 미달</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">과다 체류 재고</div>
      <div class="kpi-value text-yellow">45 개</div>
      <div class="kpi-sub warning">🕒 60일 이상 체류</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">월 예상 절감액</div>
      <div class="kpi-value text-green">₩ 4,850,000</div>
      <div class="kpi-sub neutral">최적화 적용 시</div>
    </div>
  </section>

  <!-- 하단 차트 영역 -->
  <section class="chart-container">
    <!-- 재고 등급별 현황 (도넛 차트) -->
    <div class="chart-card">
      <div class="chart-header">
        <h3>재고 등급별 현황</h3>
      </div>
      <div class="chart-wrapper">
        <canvas id="donutChart"></canvas>
      </div>
    </div>

    <!-- 위험 상품 TOP 5 (가로 바 차트) -->
    <div class="chart-card">
      <div class="chart-header">
        <h3>위험 상품 TOP 5</h3>
        <span>위험도 점수</span>
      </div>
      <div class="chart-wrapper">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </section>

  <script>
    // 1. 재고 등급별 현황 (도넛 차트)
    const ctxDonut = document.getElementById('donutChart').getContext('2d');
    new Chart(ctxDonut, {
      type: 'doughnut',
      data: {
        labels: ['정상 (850)', '주의 (210)', '장기 (120)', '악성 (70)'],
        datasets: [{
          data: [850, 210, 120, 70],
          backgroundColor: ['#22c55e', '#eab308', '#f97316', '#ef4444'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'right',
            labels: {
              color: '#94a3b8',
              font: { size: 12, weight: 'bold' },
              padding: 14
            }
          }
        },
        cutout: '70%'
      }
    });

    // 2. 위험 상품 TOP 5 (가로 바 차트)
    const ctxBar = document.getElementById('barChart').getContext('2d');
    new Chart(ctxBar, {
      type: 'bar',
      data: {
        labels: ['1. 무선 선풍기', '2. 블루투스 스피커', '3. 캠핑 의자', '4. 전기 파리채', '5. 요가 매트'],
        datasets: [{
          data: [73, 68, 64, 61, 58],
          backgroundColor: '#ef4444',
          borderRadius: 4,
          barThickness: 12
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: {
            max: 100,
            grid: { color: '#1e293b' },
            ticks: { color: '#64748b' } 
          },
          y: {
            grid: { display: false },
            ticks: { color: '#cbd5e1', font: { size: 12 } }
          }
        }
      }
    });
  </script>
</body>
</html>
