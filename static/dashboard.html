<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockClear - 분석 대시보드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261002-all-pages">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js DataLabels Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <!-- Google Fonts: Pretendard & Fredoka -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
  </style>
</head>
<body class="dashboard-page bg-[#0b1120] text-gray-100 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

  <!-- NAVIGATION HEADER -->
  <header class="bg-[#0b1120]/80 backdrop-blur-md border-b border-gray-800/80 text-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="upload.html" class="flex items-center space-x-3 cursor-pointer">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-xl shadow-lg shadow-blue-500/50">
          S
        </div>
        <span class="font-extrabold text-xl tracking-tight text-white">Stock<span class="text-blue-500">Clear</span></span>
      </a>

      <nav class="site-navigation" aria-label="주요 메뉴"></nav>
      <script src="js/site-navigation.js?v=20260922-navfix"></script>
      <script src="js/session-header.js?v=20260922-auth"></script>

      <div class="flex items-center space-x-3">
        <a href="signin.html" class="text-xs font-semibold text-gray-400 hover:text-white transition-colors px-3 py-2">로그인</a>
        <a href="signin.html" class="px-4 py-2 text-xs font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl shadow-lg shadow-blue-600/20 transition-all hover:shadow-blue-500/35">회원가입</a>
      </div>
    </div>
  </header>

  <!-- DASHBOARD CONTENT AREA -->
  <main class="flex-1 py-8 px-6 max-w-7xl mx-auto space-y-8 w-full">
    
    <!-- TOP BANNER / NAVIGATION BAR -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-gray-900/40 backdrop-blur-xl p-6 rounded-2xl border border-gray-800/80 shadow-2xl">
      <div>
        <div class="flex items-center space-x-3">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-full">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
            분석 완료
          </span>
          <span class="text-xs text-gray-400" id="dashboardUpdatedAt">데이터 확인 중</span>
        </div>
        <h1 class="text-2xl font-bold text-white mt-2 tracking-tight" id="dashboardTitle">전체 재고 종합 분석</h1>
      </div>

      <div class="flex items-center space-x-3">
        <a href="upload.html" class="px-4 py-2 border border-gray-800 bg-gray-900/80 text-gray-300 hover:text-white hover:bg-gray-800 rounded-xl text-sm font-medium transition-all flex items-center shadow-sm">
          <i class="fa-solid fa-arrow-left mr-2 text-xs"></i> 새 파일 업로드
        </a>
        <button onclick="window.print()" class="no-print px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-blue-600/25 transition-all flex items-center">
          <i class="fa-solid fa-file-arrow-down mr-2 text-xs"></i> 리포트 내보내기
        </button>
      </div>
    </div>

    <!-- SUMMARY KPI CARDS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
      <div class="bg-gray-900/40 backdrop-blur-xl p-5 rounded-2xl border border-gray-800/80 shadow-xl relative overflow-hidden group hover:border-gray-700/80 transition-all">
        <div class="flex items-center justify-between text-gray-400 mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-gray-400">전체 관리 품목</span>
          <div class="w-9 h-9 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center border border-blue-500/20">
            <i class="fa-solid fa-boxes-stacked text-sm"></i>
          </div>
        </div>
        <div id="totalSku" class="text-3xl font-black text-white tracking-tight">0 <span class="text-xs font-normal text-gray-400">개</span></div>
      </div>

      <div class="bg-gray-900/40 backdrop-blur-xl p-5 rounded-2xl border border-gray-800/80 shadow-xl relative overflow-hidden group hover:border-gray-700/80 transition-all">
        <div class="flex items-center justify-between text-gray-400 mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-gray-400">총 재고 자산</span>
          <div class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
            <i class="fa-solid fa-won-sign text-sm"></i>
          </div>
        </div>
        <div id="inventoryValue" class="text-3xl font-black text-white tracking-tight">₩ 0</div>
      </div>

      <div class="bg-gray-900/40 backdrop-blur-xl p-5 rounded-2xl border border-gray-800/80 shadow-xl relative overflow-hidden group hover:border-gray-700/80 transition-all">
        <div class="flex items-center justify-between text-gray-400 mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-gray-400">위험 재고</span>
          <div class="w-9 h-9 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center border border-rose-500/20">
            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
          </div>
        </div>
        <div id="deficitCount" class="text-3xl font-black text-rose-400 tracking-tight">0 <span class="text-xs font-normal text-gray-400">개 품목</span></div>
      </div>

      <div class="bg-gray-900/40 backdrop-blur-xl p-5 rounded-2xl border border-gray-800/80 shadow-xl relative overflow-hidden group hover:border-gray-700/80 transition-all">
        <div class="flex items-center justify-between text-gray-400 mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-gray-400">장기 재고</span>
          <div class="w-9 h-9 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center border border-amber-500/20">
            <i class="fa-solid fa-warehouse text-sm"></i>
          </div>
        </div>
        <div id="staleCount" class="text-3xl font-black text-amber-400 tracking-tight">0 <span class="text-xs font-normal text-gray-400">개 품목</span></div>
      </div>
    </div>

    <!-- VISUAL CHARTS SECTION -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- 도넛 차트 영역 -->
      <div class="bg-gray-900/40 backdrop-blur-xl p-6 rounded-2xl border border-gray-800/80 shadow-xl flex flex-col justify-between">
        <div class="flex items-center justify-between mb-2">
          <div>
            <h3 class="font-bold text-white text-lg tracking-tight">재고 등급별 현황</h3>
            <p class="text-xs text-gray-400 mt-0.5">상태별 재고 비율 분석</p>
          </div>
          <span class="text-xs px-2.5 py-1 bg-gray-800/80 text-gray-300 rounded-lg border border-gray-700/50">실시간 반영</span>
        </div>
        
        <!-- 바깥쪽 라벨을 위한 영역 높이 및 여백 확보 -->
        <div class="h-80 w-full flex items-center justify-center relative p-2">
          <canvas id="trendChart"></canvas>g
        </div>
      </div>

      <!-- 위험 상품 TOP 5 차트 영역 -->
      <div class="bg-gray-900/40 backdrop-blur-xl p-6 rounded-2xl border border-gray-800/80 shadow-xl flex flex-col justify-between">
        <div class="flex items-center justify-between mb-2">
          <div>
            <h3 class="font-bold text-white text-lg tracking-tight">위험 상품 TOP 5</h3>
            <p class="text-xs text-gray-400 mt-0.5">우선 조치 필요 재고</p>
          </div>
          <span class="text-xs text-gray-400 bg-gray-800/50 px-2 py-1 rounded">위험도 점수 기준</span>
        </div>
        <div class="h-80 flex items-center justify-center p-2">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
    </div>

  </main>

  <script src="../js/stockclear.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
