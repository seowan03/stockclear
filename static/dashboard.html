<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockClear - 분석 대시보드</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=20260922-navfix">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
  </style>
</head>
<body class="dashboard-page bg-[#0b1120] text-gray-100 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">


  <!-- NAVIGATION HEADER -->
  <header class="bg-[#0b1120] border-b border-gray-800 text-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="upload.html" class="flex items-center space-x-3 cursor-pointer">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-xl shadow-lg shadow-blue-500/50">
          S
        </div>
        <span class="font-extrabold text-xl tracking-tight text-white">Stock<span class="text-blue-500">Clear</span></span>
      </a>

      <nav class="site-navigation" aria-label="주요 메뉴"></nav>
      <script src="js/site-navigation.js?v=20260922-navfix"></script>
      <script src="js/session-header.js?v=20260922-auth"></script>

      <div class="flex items-center space-x-3">
        <a href="signin.html" class="text-xs font-semibold text-gray-300 hover:text-white transition-colors px-3 py-2">로그인</a>
        <a href="signin.html" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-lg shadow-blue-600/30 transition-all">회원가입</a>
      </div>
    </div>
  </header>

  <!-- DASHBOARD CONTENT AREA -->
  <main class="flex-1 py-8 px-6 max-w-7xl mx-auto space-y-8 w-full">
    
    <!-- TOP BANNER / NAVIGATION BAR -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-gray-900/60 backdrop-blur-sm p-6 rounded-2xl border border-gray-800 shadow-xl">
      <div>
        <div class="flex items-center space-x-3">
          <span class="px-2.5 py-0.5 text-xs font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-full">분석 완료</span>
          <span class="text-xs text-gray-400">2026.09.14 21:59 기준</span>
        </div>
        <h1 class="text-2xl font-bold text-white mt-1">A지점 재고 종합 분석 결과</h1>
      </div>

      <div class="flex items-center space-x-3">
        <a href="upload.html" class="px-4 py-2 border border-gray-700 bg-gray-800/50 text-gray-300 hover:text-white hover:bg-gray-800 rounded-xl text-sm font-medium transition-colors flex items-center">
          <i class="fa-solid fa-arrow-left mr-2"></i> 새 파일 업로드
        </a>
        <button onclick="alert('분석 리포트를 PDF로 다운로드합니다.');" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-md shadow-blue-500/20 transition-all flex items-center">
          <i class="fa-solid fa-file-arrow-down mr-2"></i> 리포트 내보내기
        </button>
      </div>
    </div>

    <!-- SUMMARY KPI CARDS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
      <div class="bg-gray-900/60 backdrop-blur-sm p-5 rounded-2xl border border-gray-800 shadow-lg">
        <div class="flex items-center justify-between text-gray-400 mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider">전체 관리 품목</span>
          <div class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center border border-blue-500/20">
            <i class="fa-solid fa-boxes-stacked text-sm"></i>
          </div>
        </div>
        <div id="totalSku" class="text-2xl font-extrabold text-white">0 <span class="text-xs font-normal text-gray-400">개</span></div>
        <p class="text-xs text-emerald-400 font-medium mt-2 flex items-center">
          <i class="fa-solid fa-arrow-up mr-1"></i> 전월 대비 +12개 증가
        </p>
      </div>

      <div class="bg-gray-900/60 backdrop-blur-sm p-5 rounded-2xl border border-gray-800 shadow-lg">
        <div class="flex items-center justify-between text-gray-400 mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider">총 재고 자산</span>
          <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
            <i class="fa-solid fa-won-sign text-sm"></i>
          </div>
        </div>
        <div id="inventoryValue" class="text-2xl font-extrabold text-white">₩ 0</div>
        <p class="text-xs text-emerald-400 font-medium mt-2 flex items-center">
          <i class="fa-solid fa-arrow-up mr-1"></i> 자산 건전성 양호
        </p>
      </div>

      <div class="bg-gray-900/60 backdrop-blur-sm p-5 rounded-2xl border border-gray-800 shadow-lg">
        <div class="flex items-center justify-between text-gray-400 mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider">재고 소진 위험 (부족)</span>
          <div class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center border border-rose-500/20">
            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
          </div>
        </div>
        <div id="deficitCount" class="text-2xl font-extrabold text-rose-400">0 <span class="text-xs font-normal text-gray-400">개 품목</span></div>
        <p class="text-xs text-rose-400 font-medium mt-2 flex items-center">
          <i class="fa-solid fa-circle-exclamation mr-1"></i> 즉시 발주 필요
        </p>
      </div>

      <div class="bg-gray-900/60 backdrop-blur-sm p-5 rounded-2xl border border-gray-800 shadow-lg">
        <div class="flex items-center justify-between text-gray-400 mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider">과다 재고 (滯留)</span>
          <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center border border-amber-500/20">
            <i class="fa-solid fa-warehouse text-sm"></i>
          </div>
        </div>
        <div id="staleCount" class="text-2xl font-extrabold text-amber-400">0 <span class="text-xs font-normal text-gray-400">개 품목</span></div>
        <p class="text-xs text-amber-400 font-medium mt-2 flex items-center">
          <i class="fa-solid fa-clock-rotate-left mr-1"></i> 할인 프로모션 권장
        </p>
      </div>
    </div>

    <!-- VISUAL CHARTS SECTION -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-gray-900/60 backdrop-blur-sm p-6 rounded-2xl border border-gray-800 shadow-lg">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold text-white text-lg">재고 등급별 현황</h3>
        </div>
        <div class="h-64">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <div class="bg-gray-900/60 backdrop-blur-sm p-6 rounded-2xl border border-gray-800 shadow-lg">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold text-white text-lg">위험 상품 TOP 5</h3>
          <span class="text-xs text-gray-400">위험도 점수</span>
        </div>
        <div class="h-64 flex items-center justify-center">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
    </div>

  </main>

  <script src="../js/stockclear.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
