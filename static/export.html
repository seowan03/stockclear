<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockClear - 상세 분석 및 내보내기</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260922-navfix">
<!-- 엑셀 추출을 위한 SheetJS 라이브러리 CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="export-page bg-[#0b1120] text-gray-100 min-h-screen flex flex-col antialiased">

<!-- HEADER NAV -->
<header class="bg-[#0b1120]/90 backdrop-blur-md border-b border-gray-800/80 text-white sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="mainpage.html" class="flex items-center space-x-3 cursor-pointer">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-xl shadow-lg shadow-blue-500/50">S</div>
    <span class="font-extrabold text-xl tracking-tight text-white">Stock<span class="text-blue-500">Clear</span></span>
    </a> 
        <nav class="site-navigation" aria-label="주요 메뉴"></nav>
        <script src="js/site-navigation.js?v=20260922-navfix"></script>
            <script src="js/session-header.js?v=20260922-auth"></script>
    <div class="flex items-center space-x-3">
    <a href="signin.html" class="text-xs font-semibold text-gray-300 hover:text-white transition-colors px-3 py-2">로그인</a>
    <a href="signin.html" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-lg shadow-blue-600/30 transition-all">회원가입</a>
    </div>
</div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 space-y-8">
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-800 pb-6">
    <div>
    <h1 id="exportTitle" class="text-2xl md:text-3xl font-extrabold text-white">상세 분석 리포트 & 내보내기</h1>
    <p class="text-gray-400 text-xs md:text-sm mt-1">심층 진단 데이터 보고서 저장 및 인쇄</p>
    </div>
    <div class="flex space-x-2 no-print">
    <button onclick="window.print()" class="px-3.5 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold rounded-xl border border-gray-700 transition-all cursor-pointer">
        <i class="fa-solid fa-print mr-1"></i>인쇄 / PDF
    </button>
    <button onclick="exportToExcel()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition-all cursor-pointer">
        <i class="fa-solid fa-file-excel mr-1"></i>Excel 저장
    </button>
    <button onclick="exportToCSV()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition-all cursor-pointer">
        <i class="fa-solid fa-file-csv mr-1"></i>CSV 저장
    </button>
    </div>
</div>

<div class="bg-gray-900/80 border border-gray-800 p-6 rounded-3xl space-y-4">
    <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-brain text-blue-400 mr-2"></i>StockClear AI 종합 진단 요약</h3>
    <p id="reportSummary" class="text-sm text-gray-200 leading-relaxed bg-gray-950 p-4 rounded-2xl border border-gray-800">AI 진단 결과를 불러오는 중입니다.</p>
    <p id="reportMetrics" class="text-xs text-gray-400"></p>
    <p id="reportScopeNote" class="text-xs text-gray-500"></p>
</div>

<!-- 내보내기 대상 데이터 미리보기 테이블 -->
<div class="bg-gray-900/80 border border-gray-800 rounded-3xl p-6 space-y-4">
    <div class="flex justify-between items-center">
        <h3 class="text-base font-bold text-white"><i class="fa-solid fa-table-list text-blue-400 mr-2"></i>리포트 데이터 목록 미리보기</h3>
        <span class="text-xs text-gray-400" id="reportCount">총 0개 항목 선택됨</span>
    </div>
    <div class="overflow-x-auto">
        <table id="reportTable" class="w-full text-left text-xs text-gray-300">
            <thead class="bg-gray-950 text-gray-400 border-b border-gray-800 uppercase">
                <tr>
                    <th class="py-3 px-4">SKU 코드</th>
                    <th class="py-3 px-4">품목명</th>
                    <th class="py-3 px-4">카테고리</th>
                    <th class="py-3 px-4">현재 수량</th>
                    <th class="py-3 px-4">재고 상태</th>
                    <th class="py-3 px-4">AI 추천 조치</th>
                </tr>
            </thead>
            <tbody id="reportBody" class="divide-y divide-gray-800/60"></tbody>
        </table>
    </div>
</div>
</main>

<footer class="bg-gray-950 border-t border-gray-800/80 py-8 px-6 text-center text-xs text-gray-500 no-print">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="flex items-center space-x-2">
    <div class="w-5 h-5 rounded bg-blue-600 flex items-center justify-center font-black text-white text-xs">S</div>
    <span class="font-bold text-gray-300">StockClear Inc.</span>
    </div>
    <p>© 2026 StockClear. All rights reserved.</p>
</div>
</footer>

<script src="../js/stockclear.js"></script>
<script>
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (character) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        async function loadExportData() {
            const params = new URLSearchParams(window.location.search);
            const uploadId = params.get('upload_id');
            const endpoint = uploadId ? `/api/export?upload_id=${encodeURIComponent(uploadId)}` : '/api/export';
            const response = await fetch(endpoint, { credentials: 'include' });
            if (response.status === 401) {
                window.location.href = 'signin.html';
                return;
            }
            if (!response.ok) throw new Error('내보내기 데이터를 불러오지 못했습니다.');
            const report = await response.json();
            const items = Array.isArray(report.items) ? report.items : [];
            if (report.upload_file_name) {
                document.getElementById('exportTitle').textContent = `${report.upload_file_name} 분석 리포트`;
            }
            const summary = report.summary || {};
            document.getElementById('reportSummary').textContent = summary.ai_summary
                || '저장된 품목별 AI 진단이 없습니다. 재고 목록에서 AI 진단을 실행하면 이 요약에 반영됩니다.';
            const scopeLabels = {
                account_active_inventory: '업로드 시점의 전체 누적 재고',
                current_account: '현재 전체 재고',
                selected_upload: '선택한 파일',
            };
            document.getElementById('reportMetrics').textContent =
                `기준: ${scopeLabels[summary.scope] || '확인 중'}${summary.as_of ? ` (${new Date(summary.as_of).toLocaleString('ko-KR')})` : ''} · 상태: ${{ complete: '완료', failed: '생성 실패', stale: '재고 변경으로 갱신 필요', legacy: '이전 진단 종합', unavailable: '요약 없음', select_upload: '업로드 선택 필요' }[summary.ai_summary_status] || '확인 불가'} · 전체 ${Number(summary.total_count || 0).toLocaleString('ko-KR')}개 · 위험 재고 ${Number(summary.risk_count || 0).toLocaleString('ko-KR')}개 · 60일 이상 장기 체류 ${Number(summary.aging_count || 0).toLocaleString('ko-KR')}개 · 품목별 진단 ${Number(summary.ai_diagnosis_count || 0).toLocaleString('ko-KR')}개`;
            const reportScopeNote = document.getElementById('reportScopeNote');
            if (summary.scope === 'account_active_inventory') {
                const sourceName = report.summary_source_file_name || '최근 업로드';
                reportScopeNote.textContent = report.upload_file_name
                    ? `AI 종합진단은 ${sourceName} 업로드 시점의 전체 활성 재고 누적 기준입니다. 아래 표는 선택한 파일의 품목만 보여줍니다.`
                    : `AI 종합진단은 ${sourceName} 시점의 전체 활성 재고 누적 기준입니다. 아래 표는 현재 전체 활성 재고입니다.`;
            } else if (summary.scope === 'selected_upload' && report.upload_file_name) {
                reportScopeNote.textContent = '이전 업로드의 저장 요약입니다. 아래 표는 선택한 파일의 품목만 보여줍니다.';
            } else {
                reportScopeNote.textContent = '';
            }
            document.getElementById('reportCount').textContent = `총 ${items.length.toLocaleString('ko-KR')}개 항목 선택됨`;
            document.getElementById('reportBody').innerHTML = items.length
                ? items.map((item) => {
                    const status = item.risk_grade || '정상';
                    const action = item.action_plans || (status === '처분 권장' ? '재고 처분 검토' : '현 상태 유지');
                    return `<tr class="hover:bg-gray-800/40"><td class="py-3 px-4 font-mono text-gray-200">${escapeHtml(item.item_id || '-')}</td><td class="py-3 px-4 font-semibold text-white">${escapeHtml(item.product_name || '-')}</td><td class="py-3 px-4">-</td><td class="py-3 px-4">${StockClear.formatNumber(item.stock_qty)}개</td><td class="py-3 px-4 ${StockClear.statusClass(status)} font-bold">${escapeHtml(status)}</td><td class="py-3 px-4">${escapeHtml(action)}</td></tr>`;
                }).join('')
                : '<tr><td colspan="6" class="py-8 text-center text-gray-500">내보낼 재고 데이터가 없습니다.</td></tr>';
        }

        loadExportData().catch((error) => {
            console.error('내보내기 데이터 로딩 실패:', error);
            document.getElementById('reportBody').innerHTML = '<tr><td colspan="6" class="py-8 text-center text-rose-400">데이터를 불러오지 못했습니다.</td></tr>';
        });

  // 1. Excel (.xlsx) 파일 다운로드 함수
  function exportToExcel() {
    const table = document.getElementById('reportTable');
    const wb = XLSX.utils.table_to_book(table, { sheet: "상세분석리포트" });
    XLSX.writeFile(wb, "StockClear_상세분석리포트.xlsx");
  }

  // 2. CSV 파일 다운로드 함수
  function exportToCSV() { 
    const table = document.getElementById('reportTable');
    const wb = XLSX.utils.table_to_book(table, { sheet: "Sheet1" });
    XLSX.writeFile(wb, "StockClear_상세분석리포트.csv", { bookType: "csv" });
  }
</script>  
</body>
</html>
