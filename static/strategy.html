<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockClear - AI 재고 최적화 전략</title>
  
  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 분리된 외부 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b1120] text-gray-100 min-h-screen flex flex-col antialiased">

  <!-- HEADER -->
  <header class="bg-[#0b1120]/90 backdrop-blur-md border-b border-gray-800/80 text-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="mainpage.html" class="flex items-center space-x-3 cursor-pointer">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-xl shadow-lg shadow-blue-500/50">S</div>
        <span class="font-extrabold text-xl tracking-tight text-white">Stock<span class="text-blue-500">Clear</span></span>
      </a>
      
      <!-- 네비게이션 링크 (AI 전략 활성화) -->
      <nav class="hidden md:flex items-center space-x-1 bg-gray-900/80 p-1 rounded-xl border border-gray-800">
        <a href="mainpage.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-house mr-1.5"></i>메인 Home</a>
        <a href="upload.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>업로드</a>
        <a href="history.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-clock-rotate-left mr-1.5"></i>업로드 기록</a>
        <a href="dashboard.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-chart-pie mr-1.5"></i>대시보드</a>
        <a href="inventory.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-boxes-stacked mr-1.5"></i>재고 목록</a>
        <a href="strategy.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-md"><i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i>AI 전략</a>
        <a href="export.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-file-export mr-1.5"></i>내보내기</a>
      </nav>

      <div class="flex items-center space-x-3">
        <a href="signin.html" class="text-xs font-semibold text-gray-300 hover:text-white transition-colors px-3 py-2">로그인</a>
        <a href="signin.html" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-lg shadow-blue-600/30 transition-all">회원가입</a>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 space-y-8">
    <div class="flex justify-between items-center border-b border-gray-800 pb-6">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white">AI 최적화 전략 수립</h1>
        <p class="text-gray-400 text-xs md:text-sm mt-1">알고리즘 기반 긴급 발주 제안 및 체류 재고 소진 솔루션</p>
      </div>
      <button onclick="alert('전략이 적용되었습니다.')" class="action-btn px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-blue-600/30">
        전체 적용
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 긴급 발주 카드 -->
      <div class="strategy-card bg-gray-900/80 border border-gray-800 rounded-3xl p-6 space-y-4">
        <h3 class="text-lg font-bold text-white flex items-center">
          <i class="fa-solid fa-cart-plus text-rose-400 mr-2"></i>긴급 발주 추천 (23건)
        </h3>
        <p class="text-xs text-gray-400">안전재고 미달 품목 자동 발주 생성</p>
        <button onclick="alert('발주서 생성 완료')" class="action-btn w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-rose-600/20">
          긴급 발주서 생성
        </button>
      </div>

      <!-- 소진 프로모션 카드 -->
      <div class="strategy-card bg-gray-900/80 border border-gray-800 rounded-3xl p-6 space-y-4">
        <h3 class="text-lg font-bold text-white flex items-center">
          <i class="fa-solid fa-tags text-amber-400 mr-2"></i>소진 프로모션 제안 (45건)
        </h3>
        <p class="text-xs text-gray-400">60일 이상 장기 체류 재고 할인 적용</p>
        <button onclick="alert('프로모션 등록 완료')" class="action-btn w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-amber-600/20">
          프로모션 등록
        </button>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-950 border-t border-gray-800/80 py-8 px-6 text-center text-xs text-gray-500">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-2">
        <div class="w-5 h-5 rounded bg-blue-600 flex items-center justify-center font-black text-white text-xs">S</div>
        <span class="font-bold text-gray-300">StockClear Inc.</span>
      </div> 
      <p>© 2026 StockClear. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
