<!DOCTYPE html>
<html lang="ko" class="auth-document">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockClear - 로그인 및 회원가입</title>
  
  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 분리된 외부 스타일시트 연결 -->
  <link rel="stylesheet" href="/css/style.css?v=20261006-customer-center">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-form-panel" aria-labelledby="authTitle">
      <div class="auth-form-content">
        <a class="auth-brand" href="mainpage.html" aria-label="StockClear 메인으로 이동">
          <span class="auth-brand__mark">S</span><span>Stock<span>Clear</span></span>
        </a>

        <div class="auth-heading">
          <span class="auth-heading__icon"><i class="fa-solid fa-lock" aria-hidden="true"></i></span>
          <h1 id="authTitle">Login</h1>
          <p id="authSubtitle">Sign in to continue to StockClear.</p>
        </div>

        <div class="auth-mode-switch" role="group" aria-label="로그인 또는 회원가입 선택">
          <button type="button" id="tabLogin" class="is-active" aria-pressed="true" onclick="switchMode('login')">Login</button>
          <button type="button" id="tabSignup" aria-pressed="false" onclick="switchMode('signup')">Sign up</button>
        </div>

        <p id="authError" class="auth-error hidden" role="alert"></p>

        <form id="authForm" class="auth-form">
          <div id="usernameField" class="hidden">
            <label for="usernameInput">Name</label>
            <input type="text" id="usernameInput" placeholder="Your name" autocomplete="name">
          </div>
          <div>
            <label for="emailInput">Email</label>
            <input type="email" id="emailInput" placeholder="name@company.com" autocomplete="email" required>
          </div>
          <div>
            <label for="passwordInput" id="passwordLabel">Password</label>
            <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password" required oninput="updatePasswordChecklist()">
            <ul id="passwordChecklist" class="auth-password-checklist hidden">
              <li id="checkLength"><i class="fa-solid fa-circle" aria-hidden="true"></i>8자 이상</li>
              <li id="checkSpecial"><i class="fa-solid fa-circle" aria-hidden="true"></i>특수문자 1자 이상 포함</li>
            </ul>
          </div>
          <div class="auth-options" id="authOptions">
            <label><input type="checkbox" id="rememberEmail"><span>Remember email</span></label>
            <button type="button" class="auth-forgot" onclick="switchMode('reset')">Forgot password?</button>
          </div>
          <p id="resetBackRow" class="auth-options hidden"><button type="button" class="auth-forgot" onclick="switchMode('login')">Back to login</button></p>
          <button type="submit" id="authSubmitBtn" class="auth-submit">Sign in</button>
        </form>

        <div class="auth-divider"><span>or continue with</span></div>
        <div class="auth-socials">
          <span class="is-unavailable" title="Google 로그인은 아직 제공되지 않습니다." aria-disabled="true"><i class="fa-brands fa-google" aria-hidden="true"></i>Google <small>준비 중</small></span>
          <a href="/api/auth/kakao"><i class="fa-solid fa-comment" aria-hidden="true"></i>Kakao</a>
        </div>
        <a class="auth-back" href="mainpage.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to home</a>
      </div>
    </section>

    <aside class="auth-welcome" aria-live="polite">
      <div class="auth-welcome__content">
        <span class="auth-welcome__eyebrow">STOCKCLEAR ACCOUNT</span>
        <h2 id="welcomeTitle">Welcome Back</h2>
        <p id="welcomeCopy">Manage your inventory with clear insights and make confident decisions.</p>
      </div>
    </aside>
  </main>

  <script>
    let mode = 'login';

    function switchMode(newMode) {
      mode = newMode;
      const isLogin = mode === 'login';
      const isSignup = mode === 'signup';
      const isReset = mode === 'reset';
      document.getElementById('tabLogin').classList.toggle('is-active', isLogin);
      document.getElementById('tabLogin').setAttribute('aria-pressed', String(isLogin));
      document.getElementById('tabSignup').classList.toggle('is-active', isSignup);
      document.getElementById('tabSignup').setAttribute('aria-pressed', String(isSignup));
      document.getElementById('usernameField').classList.toggle('hidden', isLogin);
      document.getElementById('usernameInput').required = !isLogin;
      document.getElementById('passwordInput').autocomplete = isLogin ? 'current-password' : 'new-password';
      document.getElementById('passwordLabel').innerText = isReset ? 'New password' : 'Password';
      document.getElementById('passwordInput').placeholder = isReset ? 'Enter new password' : 'Enter your password';
      document.getElementById('passwordChecklist').classList.toggle('hidden', isLogin);
      document.getElementById('authOptions').classList.toggle('hidden', !isLogin);
      document.getElementById('resetBackRow').classList.toggle('hidden', !isReset);
      document.getElementById('authTitle').innerText = isLogin ? 'Login' : isSignup ? 'Create account' : 'Reset password';
      document.getElementById('authSubtitle').innerText = isLogin
        ? 'Sign in to continue to StockClear.'
        : isSignup
          ? 'Create an account to get started.'
          : 'Enter your name and email to set a new password.';
      document.getElementById('authSubmitBtn').innerText = isLogin ? 'Sign in' : isSignup ? 'Create account' : 'Reset password';
      document.getElementById('welcomeTitle').innerText = isLogin ? 'Welcome Back' : 'Welcome to StockClear';
      document.getElementById('welcomeCopy').innerText = isLogin
        ? 'Manage your inventory with clear insights and make confident decisions.'
        : 'Start turning your inventory data into clear, practical next steps.';
      document.getElementById('authError').classList.add('hidden');
    }

    function extractErrorMessage(data) {
      const detail = data && data.detail;
      if (!detail) return null;
      if (typeof detail === 'string') return detail;
      if (Array.isArray(detail)) {
        return detail
          .map((item) => String((item && item.msg) || item).replace(/^Value error,\s*/, ''))
          .join(' ');
      }
      return null;
    }

    function updatePasswordChecklist() {
      const password = document.getElementById('passwordInput').value;
      const lengthOk = password.length >= 8;
      const specialOk = /[^A-Za-z0-9]/.test(password);
      const lengthItem = document.getElementById('checkLength');
      const specialItem = document.getElementById('checkSpecial');
      lengthItem.classList.toggle('is-met', lengthOk);
      lengthItem.querySelector('i').className = lengthOk ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle';
      specialItem.classList.toggle('is-met', specialOk);
      specialItem.querySelector('i').className = specialOk ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle';
    }

    const rememberedEmail = localStorage.getItem('stockclear.rememberedEmail');
    if (rememberedEmail) {
      document.getElementById('emailInput').value = rememberedEmail;
      document.getElementById('rememberEmail').checked = true;
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('authError');
      errorBox.classList.add('hidden');

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const username = document.getElementById('usernameInput').value.trim();

      if (mode === 'login' && document.getElementById('rememberEmail').checked) {
        localStorage.setItem('stockclear.rememberedEmail', email);
      } else if (mode === 'login') {
        localStorage.removeItem('stockclear.rememberedEmail');
      }

      const endpoint = mode === 'login' ? '/api/auth/login' : mode === 'signup' ? '/api/auth/signup' : '/api/auth/reset-password';
      const payload = mode === 'login'
        ? { email, password }
        : mode === 'signup'
          ? { email, password, username }
          : { email, username, new_password: password };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.innerText = extractErrorMessage(data) || '요청 처리 중 오류가 발생했습니다.';
          errorBox.classList.remove('hidden');
          return;
        }

        if (mode === 'reset') {
          document.getElementById('authForm').reset();
          switchMode('login');
          errorBox.innerText = '비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.';
          errorBox.classList.remove('hidden', 'auth-error');
          errorBox.classList.add('auth-success');
          return;
        }

        window.location.href = 'dashboard.html';
      } catch (err) {
        errorBox.innerText = '서버에 연결할 수 없습니다.';
        errorBox.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
