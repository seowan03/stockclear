<!DOCTYPE html>
<html lang="ko">
<head>

<style>
  /* 1. 스크롤바 유무로 인한 좌우 덜컥거림 방지 */
  html { overflow-y: scroll; }
  
  /* 2. 모든 FontAwesome 아이콘의 가로폭을 통일 */
  .fa-solid { display: inline-block; width: 1.25em; text-align: center; }
</style>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockClear - 로그인 및 회원가입</title>
  
  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 분리된 외부 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b1120] text-gray-100 min-h-screen flex flex-col justify-between antialiased">

  <!-- HEADER -->
  <header class="bg-[#0b1120]/90 backdrop-blur-md border-b border-gray-800/80 text-white sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="mainpage.html" class="flex items-center space-x-3 cursor-pointer">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-xl shadow-lg shadow-blue-500/50">S</div>
        <span class="font-extrabold text-xl tracking-tight text-white">Stock<span class="text-blue-500">Clear</span></span>
      </a>
      <a href="mainpage.html" class="text-xs font-semibold text-gray-400 hover:text-white transition-colors">
        <i class="fa-solid fa-house mr-1"></i>메인으로 돌아가기
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 flex items-center justify-center p-6">
    <div class="auth-card w-full max-w-md bg-gray-900/90 border border-gray-800 rounded-3xl p-8 shadow-2xl space-y-6">
      
      <div class="text-center space-y-2">
        <h1 class="text-2xl font-black text-white" id="authTitle">StockClear 로그인</h1>
        <p class="text-xs text-gray-400" id="authSubtitle">서비스 이용을 위해 로그인하세요.</p>
      </div>

      <!-- 로그인 / 회원가입 전환 탭 -->
      <div class="grid grid-cols-2 gap-2 bg-gray-950 border border-gray-800 rounded-xl p-1">
        <button type="button" id="tabLogin" onclick="switchMode('login')" class="py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition-colors">로그인</button>
        <button type="button" id="tabSignup" onclick="switchMode('signup')" class="py-2 text-xs font-bold rounded-lg text-gray-400 transition-colors">회원가입</button>
      </div>

      <p id="authError" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg px-3 py-2"></p>

      <form id="authForm" class="space-y-4">
        <div id="usernameField" class="hidden">
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">이름</label>
          <input type="text" id="usernameInput" placeholder="홍길동" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">이메일 주소</label>
          <input type="email" id="emailInput" placeholder="name@company.com" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1.5">비밀번호</label>
          <input type="password" id="passwordInput" placeholder="••••••••" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white">
        </div>
        <button type="submit" id="authSubmitBtn" class="block text-center w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-600/30 transition-all border-none cursor-pointer">
          로그인
        </button>
      </form>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-gray-800"></div>
        <span class="flex-shrink mx-4 text-[11px] text-gray-500">소셜 계정 간편 로그인</span>
        <div class="flex-grow border-t border-gray-800"></div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <a href="dashboard.html" class="social-btn flex items-center justify-center space-x-2 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-xs font-semibold text-gray-300">
          <i class="fa-brands fa-google"></i><span>Google</span>
        </a>
        <a href="dashboard.html" class="social-btn flex items-center justify-center space-x-2 py-2.5 bg-gray-950 border border-gray-800 rounded-xl text-xs font-semibold text-gray-300">
          <i class="fa-solid fa-comment"></i><span>Kakao</span>
        </a>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-950 border-t border-gray-800/80 py-6 px-6 text-center text-xs text-gray-500">
    <p>© 2026 StockClear. All rights reserved.</p>
  </footer>

  <script>
    let mode = 'login';

    function switchMode(newMode) {
      mode = newMode;
      const isLogin = mode === 'login';
      document.getElementById('tabLogin').classList.toggle('bg-blue-600', isLogin);
      document.getElementById('tabLogin').classList.toggle('text-white', isLogin);
      document.getElementById('tabLogin').classList.toggle('text-gray-400', !isLogin);
      document.getElementById('tabSignup').classList.toggle('bg-blue-600', !isLogin);
      document.getElementById('tabSignup').classList.toggle('text-white', !isLogin);
      document.getElementById('tabSignup').classList.toggle('text-gray-400', isLogin);
      document.getElementById('usernameField').classList.toggle('hidden', isLogin);
      document.getElementById('authTitle').innerText = isLogin ? 'StockClear 로그인' : 'StockClear 회원가입';
      document.getElementById('authSubtitle').innerText = isLogin ? '서비스 이용을 위해 로그인하세요.' : '새 계정을 생성하고 서비스를 시작하세요.';
      document.getElementById('authSubmitBtn').innerText = isLogin ? '로그인' : '회원가입';
      document.getElementById('authError').classList.add('hidden');
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('authError');
      errorBox.classList.add('hidden');

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const username = document.getElementById('usernameInput').value.trim();

      const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/signup';
      const payload = mode === 'login' ? { email, password } : { email, password, username };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.innerText = data.detail || '요청 처리 중 오류가 발생했습니다.';
          errorBox.classList.remove('hidden');
          return;
        }

        window.location.href = 'dashboard.html';
      } catch (err) {
        errorBox.innerText = '서버에 연결할 수 없습니다.';
        errorBox.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
